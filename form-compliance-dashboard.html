let current=FORMS[0], currentView='overview', region='All';
const $=s=>document.querySelector(s); const pct=v=>v==null?'—':Math.round(v*100)+'%'; const n=v=>Number(v||0).toLocaleString();
function cls(v,good=.9,warn=.75){return v==null?'':v>=good?'good':v>=warn?'warn':'bad'}
function pill(txt,type){return `<span class="pill p-${type}">${txt}</span>`}
function selectInit(){const fs=$('#formSelect');fs.innerHTML=FORMS.map((f,i)=>`<option value="${i}">${f.name}</option>`).join('');fs.onchange=()=>{current=FORMS[+fs.value];region='All';regionInit();render()};regionInit();$('#regionSelect').onchange=e=>{region=e.target.value;render()}}
function regionInit(){let rs=$('#regionSelect');rs.innerHTML='<option value="All">All regions</option>'+current.regions.map(r=>`<option>${r.region}</option>`).join('')}
function filteredRegions(){return region==='All'?current.regions:current.regions.filter(r=>r.region===region)}
function summary(f=current){let regs=filteredRegions(); if(region==='All')return f; let target=regs.reduce((a,x)=>a+x.target,0),captured=regs.reduce((a,x)=>a+x.captured,0),yes=regs.reduce((a,x)=>a+x.yes,0),no=regs.reduce((a,x)=>a+x.no,0);return {...f,target,captured,coverage:target?captured/target:0,yes,no,notCaptured:target-captured,compliance:yes+no?yes/(yes+no):(regs[0]?.compliance??null)}}
function kpis(){const f=summary();return `<div class="kpis"><div class="card kpi"><div class="label">Target stores</div><div class="val">${n(f.target)}</div><div class="hint">Stores expected to capture</div></div><div class="card kpi"><div class="label">Captured</div><div class="val">${n(f.captured)}</div><div class="hint">${n(f.notCaptured)} still outstanding</div></div><div class="card kpi"><div class="label">Coverage</div><div class="val ${cls(f.coverage,.95,.85)}">${pct(f.coverage)}</div><div class="hint">Capture completion</div></div><div class="card kpi"><div class="label">Compliance</div><div class="val ${cls(f.compliance,.9,.75)}">${pct(f.compliance)}</div><div class="hint">${f.complianceLabel}</div></div><div class="card kpi"><div class="label">Re-visits</div><div class="val">${n(f.duplicates)}</div><div class="hint">Stores with multiple submissions</div></div></div>`}
function formCards(){return `<div class="formcards">${FORMS.map((f,i)=>`<div class="formcard ${f===current?'selected':''}" onclick="document.querySelector('#formSelect').value=${i};current=FORMS[${i}];region='All';regionInit();render()"><div class="name">${f.name}</div><div class="mini"><span>Coverage</span><b>${pct(f.coverage)}</b></div><div class="meter"><i style="width:${Math.round(f.coverage*100)}%"></i></div><div class="mini"><span>${f.complianceLabel}</span><b>${pct(f.compliance)}</b></div></div>`).join('')}</div>`}
function donut(){const f=summary(),v=f.coverage||0;return `<div class="donutwrap"><div class="donut" style="background:conic-gradient(var(--green) ${v*360}deg,#173650 0)"><strong>${pct(v)}</strong><span>coverage</span></div></div>`}
function regionBars(metric='coverage'){let data=filteredRegions().slice().sort((a,b)=>(b[metric]??-1)-(a[metric]??-1));return `<div class="bars">${data.map(r=>`<div class="barrow"><div class="nm" title="${r.region}">${r.region}</div><div class="bar"><i style="width:${Math.round((r[metric]||0)*100)}%"></i></div><b class="${cls(r[metric],metric==='coverage'?.95:.9,metric==='coverage'?.85:.75)}">${pct(r[metric])}</b></div>`).join('')}</div>`}
function qIssues(){let qs=current.questions.filter(q=>q.compliance!=null).sort((a,b)=>a.compliance-b.compliance).slice(0,6);if(!qs.length)qs=current.questions.filter(q=>q.average!=null).slice(0,6);return qs.length?qs.map(q=>`<div class="qitem"><div class="qname">${q.question}</div><div class="qmeta"><span>${q.type}</span><b class="${cls(q.compliance)}">${q.compliance!=null?pct(q.compliance):'Avg '+Number(q.average||0).toFixed(1)}</b></div></div>`).join(''):'<div class="sub">This survey is numeric / price capture, so a Yes/No compliance score is not applicable.</div>'}
function alerts(){let regs=current.regions.filter(r=>r.coverage<.9|| (r.compliance!=null&&r.compliance<.75)).sort((a,b)=>a.coverage-b.coverage).slice(0,4);let ex=current.exceptions.filter(x=>x.captured!=='Yes').slice(0,3);return `<div class="alertlist">${regs.map(r=>`<div class="alert"><b>${r.region}: ${pct(r.coverage)} coverage</b><small>${r.target-r.captured} store(s) outstanding${r.compliance!=null?' • '+pct(r.compliance)+' compliance':''}</small></div>`).join('')}${ex.map(x=>`<div class="alert"><b>${x.name}</b><small>Not captured • ${x.rep||'Unassigned'}</small></div>`).join('')||'<div class="sub">No critical outstanding items.</div>'}</div>`}
function overview(){return `${kpis()}<div class="grid2"><div class="card"><div class="hd"><h3>Active Form Portfolio</h3><small>Click a form to drill in</small></div>${formCards()}</div><div class="card"><div class="hd"><h3>Capture Completion</h3><small>${current.period}</small></div>${donut()}</div></div><div class="grid3"><div class="card"><div class="hd"><h3>Coverage by Region</h3><small>Highest to lowest</small></div>${regionBars('coverage')}</div><div class="card"><div class="hd"><h3>Question Watchlist</h3><small>Lowest compliance / survey KPIs</small></div>${qIssues()}</div><div class="card"><div class="hd"><h3>Action Required</h3><small>Priority exceptions</small></div>${alerts()}</div></div>`}
function formView(){return `${kpis()}<div class="card"><div class="hd"><h3>Question-Level Performance</h3><small>${current.questions.length} configured questions</small></div><div class="tablewrap"><table><thead><tr><th>Question</th><th>Type</th><th>Answered</th><th>Yes</th><th>No</th><th>Compliance / Average</th></tr></thead><tbody>${current.questions.map(q=>`<tr><td>${q.question}</td><td>${q.type||''}</td><td>${n(q.answered)}</td><td>${n(q.yes)}</td><td>${n(q.no)}</td><td>${q.compliance!=null?pill(pct(q.compliance),q.compliance>=.9?'good':q.compliance>=.75?'warn':'bad'):q.average!=null?Number(q.average).toFixed(2):'—'}</td></tr>`).join('')}</tbody></table></div></div>`}
function regionsView(){return `${kpis()}<div class="grid2"><div class="card"><div class="hd"><h3>Regional Coverage</h3><small>Completion against target</small></div>${regionBars('coverage')}</div><div class="card"><div class="hd"><h3>Regional Compliance</h3><small>Where applicable</small></div>${regionBars('compliance')}</div></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Region</th><th>Target</th><th>Captured</th><th>Outstanding</th><th>Coverage</th><th>Compliance</th></tr></thead><tbody>${filteredRegions().map(r=>`<tr><td>${r.region}</td><td>${n(r.target)}</td><td>${n(r.captured)}</td><td>${n(r.target-r.captured)}</td><td>${pill(pct(r.coverage),r.coverage>=.95?'good':r.coverage>=.85?'warn':'bad')}</td><td>${r.compliance==null?'—':pill(pct(r.compliance),r.compliance>=.9?'good':r.compliance>=.75?'warn':'bad')}</td></tr>`).join('')}</tbody></table></div></div>`}
function rank(arr){return arr.slice().sort((a,b)=>(a.coverage-b.coverage)||((a.compliance??1)-(b.compliance??1))).slice(0,25)}
function peopleTable(arr,label){return `<div class="card"><div class="hd"><h3>${label}</h3><small>Lowest coverage first</small></div><div class="tablewrap"><table><thead><tr><th>${label==='Managers'?'Manager':'Rep'}</th><th>Target</th><th>Captured</th><th>Coverage</th><th>Compliance</th></tr></thead><tbody>${rank(arr).map(x=>`<tr><td>${x.name}</td><td>${n(x.target)}</td><td>${n(x.captured)}</td><td>${pill(pct(x.coverage),x.coverage>=.95?'good':x.coverage>=.85?'warn':'bad')}</td><td>${x.compliance==null?'—':pill(pct(x.compliance),x.compliance>=.9?'good':x.compliance>=.75?'warn':'bad')}</td></tr>`).join('')}</tbody></table></div></div>`}
function peopleView(){return `${kpis()}<div class="grid2">${peopleTable(current.managers,'Managers')}${peopleTable(current.reps,'Reps')}</div>`}
function exceptionView(){let ex=current.exceptions.filter(x=>region==='All'||x.region===region);return `${kpis()}<div class="note">Exception logic: not captured, a “No” execution result, or store compliance below 80%. This is intended as the operational action list.</div><div class="card"><div class="hd"><h3>Store Exceptions</h3><small>${ex.length} stores requiring review</small></div><div class="tablewrap"><table><thead><tr><th>Store</th><th>Region</th><th>Manager</th><th>Rep</th><th>Capture</th><th>Result</th><th>Compliance</th><th>Photo</th><th>Evidence</th></tr></thead><tbody>${ex.map(x=>`<tr><td><b>${x.name}</b><br><span class="sub">${x.code}</span></td><td>${x.region||''}</td><td>${x.manager||''}</td><td>${x.rep||''}</td><td>${x.captured==='Yes'?pill('Captured','good'):pill('Outstanding','bad')}</td><td>${x.status?pill(x.status,String(x.status).toLowerCase()==='yes'?'good':'bad'):'—'}</td><td>${x.compliance==null?'—':pct(x.compliance)}</td><td>${x.photo||'—'}</td><td>${x.image?`<a class="link" href="${x.image}" target="_blank">View image</a>`:'—'}</td></tr>`).join('')}</tbody></table></div></div>`}
function render(){let fn={overview,forms:formView,regions:regionsView,people:peopleView,exceptions:exceptionView}[currentView];$('#app').innerHTML=fn()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentView=b.dataset.view;render()});
selectInit();render();
</script></body></html>
