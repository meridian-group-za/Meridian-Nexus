            (entry.compressed ? toBase64(finalBytes) : entry.data);

        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // attributes through, so match the full opening tag. slice() rather than

    const headOpen = template.match(/<head[^>]*>/i);

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');

    const dead = Array.from(document.scripts);

      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

l=\"noopener\" class=\"nx-opt link\" style=\"display:flex; flex-direction:column; padding:22px; border-radius:14px; background:rgba(18,58,104,0.42); border:1px solid rgba(28,63,107,0.95);\">\n          <div style=\"font-size:15.5px; font-weight:600; color:#f3f7fc; margin-bottom:6px;\">Training Hub<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.5; color:#9dc4ec; flex:1;\">Check the latest results, track your teams and more.<\u002Fdiv>\n          <span class=\"nx-go\" style=\"align-self:flex-start; margin-top:16px; display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; background:rgba(236,109,37,0.14); color:#ec6d25; font-size:12.5px; font-weight:600;\">Open Dashboard <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://training.meridiangroup.co.za/app/learn/landing\" target=\"_blank\" rel=\"noopener\" class=\"nx-opt link\" style=\"display:flex; flex-direction:column; padding:22px; border-radius:14px; background:rgba(18,58,104,0.42); border:1px solid rgba(28,63,107,0.95);\">\n          <div style=\"font-size:15.5px; font-weight:600; color:#f3f7fc; margin-bottom:6px;\">Meridian Training Academy<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.5; color:#9dc4ec; flex:1;\">Courses, guided journeys and quizzes for field and office teams.<\u002Fdiv>\n          <span class=\"nx-go\" style=\"align-self:flex-start; margin-top:16px; display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; background:rgba(236,109,37,0.14); color:#ec6d25; font-size:12.5px; font-weight:600;\">Open <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- IN-DEVELOPMENT MODULES -->\n    <sc-if value=\"{{ isDev }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:720px;\">\n      <div style=\"display:flex; align-items:center; gap:16px; margin-bottom:10px;\">\n        <div style=\"width:54px; height:54px; border-radius:13px; display:grid; place-items:center; background:rgba(157,196,236,0.1); border:1px solid rgba(157,196,236,0.24); color:#9dc4ec;\">\n          <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <h1 style=\"font-size:26px; font-weight:600; margin:0; color:#f3f7fc;\">{{ devName }}<\u002Fh1>\n          <div style=\"font-size:13.5px; color:#9dc4ec; margin-top:3px;\">{{ devDesc }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:1px; background:linear-gradient(90deg, rgba(157,196,236,0.22), transparent); margin:22px 0 26px;\"><\u002Fdiv>\n      <div style=\"padding:28px; border-radius:14px; background:rgba(18,58,104,0.32); border:1px dashed rgba(28,63,107,0.95);\">\n        <div style=\"display:inline-flex; align-items:center; gap:8px; padding:5px 12px; border-radius:20px; background:rgba(236,109,37,0.14); border:1px solid rgba(236,109,37,0.32); font-size:11.5px; font-weight:600; color:#f2955c; margin-bottom:14px;\"><span style=\"width:6px; height:6px; border-radius:50%; background:#ec6d25;\"><\u002Fspan>In development<\u002Fdiv>\n        <p style=\"margin:0; font-size:14px; line-height:1.6; color:#c9d7e6; max-width:520px;\">This module is being built. When it's ready, its tools and links will appear here — same layout as StockFix and Geo.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { view: 'overview', query: '', userName: '', userInitials: '', updates: [] };\n  componentDidMount() {\n    fetch('updates.json')\n      .then(r => r.ok ? r.json() : [])\n      .then(d => this.setState({ updates: Array.isArray(d) ? d : [] }))\n      .catch(() => {});\n    const cfg = {\n      auth: {\n        clientId: \"73cf19b5-ae3e-4a6e-995a-c539b75a37c5\",\n        authority: \"https://login.microsoftonline.com/cbe83df2-b350-4dab-8d5f-f78d21fe7d27\",\n        redirectUri: window.location.origin + window.location.pathname\n      },\n      cache: { cacheLocation: \"localStorage\", storeAuthStateInCookie: true }\n    };\n    const start = () => {\n      if (!window.msal) { setTimeout(start, 150); return; }\n      try {\n        this.msal = new msal.PublicClientApplication(cfg);\n        const acct = this.msal.getAllAccounts()[0];\n        const onProd = location.hostname.indexOf('github.io') !== -1;\n        if (!acct) { if (onProd) window.location.href = 'index.html'; return; }\n        const name = acct.name || acct.username || 'Meridian User';\n        const initials = name.trim().split(/\\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();\n        this.setState({ userName: name, userInitials: initials });\n      } catch (e) {}\n    };\n    start();\n  }\n  renderVals() {\n    const v = this.state.view;\n    const act = (id) => (v === id ? 'active' : '');\n    const devMeta = {\n      capture:  { name: 'Capture',  desc: 'Photo validation and compliance tracking on every visit.' },\n      activate: { name: 'Activate', desc: 'Trade activation and promotional campaign management.' },\n    };\n    const dev = devMeta[v];\n    const modules = [\n      { id:'activate', name:'Activate', desc:'Trade activation and promotional campaign management.' },\n      { id:'callcycle', name:'Call Cycle Management', desc:'Schedule build, conflict resolution and coverage.' },\n      { id:'capture', name:'Capture', desc:'Photo validation and compliance tracking.' },\n      { id:'connect', name:'Connect', desc:'Mobile-driven field comms and campaign execution.' },\n      { id:'geo', name:'Geo', desc:'Geo-verified store coverage and route tracking.' },\n      { id:'insights', name:'Insights', desc:'Live dashboards and reporting across execution.' },\n      { id:'learn', name:'Learn', desc:'Mobile-first training, journeys and quizzes.' },\n      { id:'stockfix', name:'StockFix', desc:'Out-of-stock detection, listing gaps and replenishment.' },\n    ];\n    const q = (this.state.query || '').trim().toLowerCase();\n    const results = q ? modules.filter(m => (m.name + ' ' + m.desc).toLowerCase().includes(q)) : [];\n    return {\n      searching: q.length > 0,\n      notSearching: q.length === 0,\n      results,\n      onSearch: (e) => this.setState({ query: e.target.value }),\n      nav: (e) => this.setState({ view: e.currentTarget.dataset.view }),\n      userName: this.state.userName || 'Meridian User',\n      userInitials: this.state.userInitials || 'M',\n      greeting: this.state.userName ? ('Welcome back, ' + this.state.userName.trim().split(/\\s+/)[0] + '.') : 'Welcome back.',\n      signOut: () => { if (this.msal) { this.msal.logoutRedirect(); } },\n      updates: this.state.updates,\n      hasUpdates: (this.state.updates || []).length > 0,\n      updateCount: (this.state.updates || []).length,\n      isOverview: v === 'overview',\n      isStockfix: v === 'stockfix',\n      isGeo: v === 'geo',\n      isCallcycle: v === 'callcycle',\n      isLearn: v === 'learn',\n      isInsights: v === 'insights',\n      isConnect: v === 'connect',\n      isDev: !!dev,\n      devName: dev ? dev.name : '',\n      devDesc: dev ? dev.desc : '',\n      actOverview: act('overview'),\n      actStockfix: act('stockfix'),\n      actGeo: act('geo'),\n      actCallcycle: act('callcycle'),\n      actConnect: act('connect'),\n      actCapture: act('capture'),\n      actInsights: act('insights'),\n      actActivate: act('activate'),\n      actLearn: act('learn'),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
